expname: high_quality_test
data:
  datadir: [data/long/RS307, data/long/RS330]
  far: 4.5
  fov: 25
  imsize: 256  # 提升解析度
  near: 1.5
  orthographic: False
  use_default_rays : False
  radius: 3.
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4166667, 0.3333334, 0.25, 0.1666667

discriminator:
  num_classes: 2
  hflip: false
  ndf: 96  # 提升容量

nerf:
  N_samples: 96          # 提升採樣點
  N_importance: 64       # 啟用 hierarchical sampling
  decrease_noise: true
  i_embed: 0
  multires: 12           # 提升位置編碼
  multires_views: 6      # 提升視角編碼
  netdepth: 8
  netwidth: 384          # 提升網絡寬度
  perturb: 1.0
  raw_noise_std: 0.5     # 降低初始噪聲
  use_viewdirs: true
  netdepth_fine: 8
  netwidth_fine: 384

ray_sampler:
  N_samples: 2048        # 256*256 / 32
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025

training:
  backup_every: 50000
  batch_size: 4          # 降低 batch size 以適應更高解析度
  chunk: 65536           # 提升 chunk size
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 50000,100000,200000
  lr_d: 0.0001
  lr_g: 0.0002           # 調整學習率
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 131072       # 提升
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 10.0
  restart_every: -1
  sample_every: 500
  save_every: 1000
  save_best: fid
  take_model_average: true

z_dist:
  dim: 256
  type: gauss
