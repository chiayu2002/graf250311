expname: simple_wider_network_fixed
data:
  datadir: [data/long/RS307, data/long/RS330]
  far: 4.5
  fov: 25
  imsize: 256
  near: 1.5
  orthographic: False
  use_default_rays: False
  radius: 3.
  type: RS307_0_i2
  umax: 1.
  umin: 0.
  vmax: 0.5
  vmin: 0.
  v: 0.5, 0.4166667, 0.3333334, 0.25, 0.1666667

discriminator:
  num_classes: 2
  hflip: false
  ndf: 96

nerf:
  N_samples: 96
  N_importance: 0             # 不使用 hierarchical sampling
  decrease_noise: true
  i_embed: 0
  multires: 12                # 更高頻位置編碼
  multires_views: 6           # 更高頻視角編碼
  netdepth: 10                # 稍微增加深度 8 -> 10
  netwidth: 384               # 增加寬度 256 -> 384
  perturb: 1.0
  raw_noise_std: 0.5
  use_viewdirs: true
  netdepth_fine: 10
  netwidth_fine: 384
  # 不設置 model_version，使用原始架構但更寬

ray_sampler:
  N_samples: 4096             # 修正: 64×64 = 4096 (完全平方數)
  max_scale: 1.0
  min_scale: 0.25
  scale_anneal: 0.0025

training:
  backup_every: 50000
  batch_size: 6               # 適中的 batch size
  chunk: 65536
  equalize_lr: false
  fid_every: 5000
  gan_type: standard
  lr_anneal: 0.5
  lr_anneal_every: 50000,100000,200000
  lr_d: 0.0001
  lr_g: 0.0002
  model_average_beta: 0.999
  model_average_reinit: false
  model_file: model.pt
  netchunk: 131072
  nworkers: 0
  optimizer: rmsprop
  outdir: ./results
  print_every: 10
  reg_param: 10.0
  restart_every: -1
  sample_every: 500
  save_every: 1000
  save_best: fid
  take_model_average: true

z_dist:
  dim: 256
  type: gauss
